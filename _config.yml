# ─────────────────────────────────────────────
#  사이트 기본 정보: 이 부분만 바꿔도 블로그 정보가 내 정보로 바뀝니다.
# ─────────────────────────────────────────────
title: "aru.log"              # 블로그 이름
description: "My Tech Blog"
url: "https://aru0909.github.io" # ← USERNAME을 본인 GitHub 아이디로 바꾸세요
baseurl: ""                       # 저장소 이름이 username.github.io라면 비워 둡니다
lang: ko
timezone: Asia/Seoul

author:
  name: "최지수(Choi Jisoo)"               # ← 이름이나 닉네임
  bio: "관심분야: AI Security, Embedded Security, CTF"          # ← 이름 아래 한 줄
  avatar: ""                      # 프로필 사진 경로. 예: /assets/img/avatar.png (비우면 이름 첫 글자)
  github: "aru0909"              # ← GitHub 아이디
  email: "aru0909@ewha.ac.kr"                       # 공개해도 괜찮은 메일 주소만 적으세요

# 사이드바에 보여 줄 활동 이력입니다. 위에서부터 순서대로 나옵니다.
timeline:
  - date: "26.11. ~"
    text: "Frontier"
  - date: "26.03. ~"
    text: "이화여자대학교 사이버보안학과"

# 댓글 기능(선택): https://giscus.app 에서 값을 발급받아 채운 뒤 enabled를 true로 바꾸세요.
giscus:
  enabled: false
  repo: ""
  repo_id: ""
  category: "Comments"
  category_id: ""

# ─────────────────────────────────────────────
#  빌드 설정: GitHub Pages 기본 빌드에 맞춰 두었으므로 고치지 않아도 됩니다.
# ─────────────────────────────────────────────
permalink: /posts/:year/:month/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      toc: true
      comments: true
  - scope: { path: "" }
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .preview
