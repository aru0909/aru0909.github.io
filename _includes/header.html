<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="nav">
      <a href="{{ '/' | relative_url }}">홈</a>
      <a href="{{ '/categories/' | relative_url }}">카테고리</a>
      <a href="{{ '/about/' | relative_url }}">소개</a>
      <button class="search-btn" data-search-open aria-label="검색">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="theme-btn" id="theme-toggle" type="button" aria-label="밝은 화면과 어두운 화면 전환" title="화면 모드 전환">
        <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<div class="search" id="search" hidden>
  <div class="search-backdrop" data-close></div>
  <div class="search-panel" role="dialog" aria-label="글 검색">
    <input id="search-input" type="search" placeholder="검색" autocomplete="off">
    <ul class="search-results" id="search-results"></ul>
  </div>
</div>
