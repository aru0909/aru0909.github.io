{%- assign p = include.post -%}
{%- assign cat = site.data.categories | where: "slug", p.categories.first | first -%}
<li class="row{% if p.pin %} is-pin{% endif %}">
  <a href="{{ p.url | relative_url }}">
    <time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%y.%m.%d" }}</time>
    <span class="row-title">{% if p.pin %}<span class="row-pin">{% include icons/pin.svg %}</span>{% endif %}{{ p.title }}</span>
    {% if cat and include.hide_cat != true %}<span class="row-cat">{{ cat.name }}</span>{% endif %}
  </a>
</li>
